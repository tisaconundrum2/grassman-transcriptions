name: Train & Export ONNX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_samples:
        description: 'Training samples'
        default: '50'
        type: string
      epochs:
        description: 'Training epochs'
        default: '5'
        type: string
      mode:
        description: 'Model mode'
        default: 'seq2seq'
        type: choice
        options:
          - seq2seq
          - ctc

jobs:
  train-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install onnxruntime

      - name: Set training params
        id: params
        run: |
          # Use workflow_dispatch inputs or defaults for push/PR
          echo "samples=${{ inputs.max_samples || '50' }}" >> "$GITHUB_OUTPUT"
          echo "epochs=${{ inputs.epochs || '5' }}" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.mode || 'seq2seq' }}" >> "$GITHUB_OUTPUT"

      - name: Run demo (smoke test)
        run: python app.py demo

      - name: Train model
        run: |
          MODE_FLAG=""
          if [ "${{ steps.params.outputs.mode }}" = "ctc" ]; then
            MODE_FLAG="--ctc"
          fi

          python train_gpu.py \
            --max-samples ${{ steps.params.outputs.samples }} \
            --epochs ${{ steps.params.outputs.epochs }} \
            --batch-size 8 \
            --layers 2 \
            --d-model 128 \
            --r-reduced 16 \
            --decoder-layers 2 \
            --save-dir checkpoints \
            --decode-every 2 \
            $MODE_FLAG

      - name: Save model bundle
        run: |
          python -c "
          from src.services.model_hub_service import save_model, load_model
          from src.models.config import GrassmannConfig
          from src.models.grassmann_seq2seq import GrassmannSeq2SeqModel
          from src.models.grassmann_model import GrassmannTranscriptionModel
          from src.services.tokenizer_service import CharTokenizer
          import torch, json

          # Load best checkpoint and re-save as a proper bundle
          config = GrassmannConfig(
              n_layers=2, d_model=128, r_reduced=16,
              n_decoder_layers=2,
              use_seq2seq=${{ steps.params.outputs.mode == 'seq2seq' && 'True' || 'False' }},
          )
          tokenizer = CharTokenizer()
          config.vocab_size = tokenizer.vocab_size

          if config.use_seq2seq:
              model = GrassmannSeq2SeqModel(config)
          else:
              model = GrassmannTranscriptionModel(config)

          state = torch.load('checkpoints/best_model.pt', map_location='cpu', weights_only=True)
          model.load_state_dict(state)
          save_model(model, config, 'model_bundle')
          "

      - name: Export to ONNX
        run: |
          python export_onnx.py \
            --model model_bundle \
            --output onnx_export \
            --verify

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: grassmann-model-bundle
          path: model_bundle/
          retention-days: 30

      - name: Upload ONNX export
        uses: actions/upload-artifact@v4
        with:
          name: grassmann-onnx-${{ steps.params.outputs.mode }}
          path: onnx_export/
          retention-days: 30

      - name: Training summary
        run: |
          echo "## Training Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | ${{ steps.params.outputs.mode }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Samples | ${{ steps.params.outputs.samples }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Epochs | ${{ steps.params.outputs.epochs }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Architecture | 2L enc / 2L dec / d=128 / r=16 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- **grassmann-model-bundle**: PyTorch weights + config" >> "$GITHUB_STEP_SUMMARY"
          echo "- **grassmann-onnx**: ONNX export for cross-platform inference" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ONNX Files" >> "$GITHUB_STEP_SUMMARY"
          ls -lh onnx_export/ >> "$GITHUB_STEP_SUMMARY"
