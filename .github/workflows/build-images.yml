name: Build Docker Images

on:
  push:
    branches: [main]
    tags: ['train-*']
    paths:
      - Transcriptions.Resarch/**
      - requirements.txt
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  ACR: schultzregistry.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ablation
            dockerfile: Transcriptions.Resarch/Train.Ablation/Dockerfile
            image: grassmann-ablation
          - name: grassmann
            dockerfile: Transcriptions.Resarch/Train.Grassman/Dockerfile
            image: grassmann-plucker
          - name: eval
            dockerfile: Transcriptions.Resarch/Test.Evaluation/Dockerfile
            image: grassmann-eval
          - name: cache
            dockerfile: Transcriptions.Resarch/Cache/Dockerfile
            image: grassmann-cache
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/train-')
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Determine target job from tag
        id: target
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # train-ablation-v1 → grassmann-ablation-train
          # train-phone-calls-v1 → phone-calls-ablation
          if [[ "$TAG" == train-phone-calls-* ]]; then
            echo "job=phone-calls-ablation" >> "$GITHUB_OUTPUT"
          else
            echo "job=grassmann-ablation-train" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update image and start ${{ steps.target.outputs.job }}
        run: |
          az containerapp job update \
            -n ${{ steps.target.outputs.job }} \
            -g fetchit-speech-to-text \
            --image ${{ env.GHCR }}/${{ github.repository_owner }}/grassmann-ablation:${{ github.sha }}

          az containerapp job start \
            -n ${{ steps.target.outputs.job }} \
            -g fetchit-speech-to-text