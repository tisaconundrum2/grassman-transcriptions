name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.*
      - src/**
      - app.py
      - recipes.yaml
      - requirements.txt
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/grassmann:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/grassmann:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
