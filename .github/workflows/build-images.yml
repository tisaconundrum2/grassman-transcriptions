name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - Transcriptions.Resarch/**
      - requirements.txt
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io
  ACR: schultzregistry.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ablation
            dockerfile: Transcriptions.Resarch/Train.Ablation/Dockerfile
            image: grassmann-ablation
          - name: grassmann
            dockerfile: Transcriptions.Resarch/Train.Grassman/Dockerfile
            image: grassmann-plucker
          - name: eval
            dockerfile: Transcriptions.Resarch/Test.Evaluation/Dockerfile
            image: grassmann-eval
          - name: cache
            dockerfile: Transcriptions.Resarch/Cache/Dockerfile
            image: grassmann-cache
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  deploy-ablation:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update image and start training job
        run: |
          az containerapp job update \
            -n grassmann-ablation-train \
            -g fetchit-speech-to-text \
            --image ${{ env.ACR }}/grassmann-ablation:${{ github.sha }}

          az containerapp job start \
            -n grassmann-ablation-train \
            -g fetchit-speech-to-text